<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <section class="intro">
    <h1>Say hello.<br>We read every message.</h1>
    <p>Send us a question, an idea or feedback. Your message is saved to our MySQL database and we reply by email.</p>
    <p class="note">TYBCA &middot; ISA3 &middot; Split deployment project</p>
  </section>

  <section class="form-wrap">
    <form id="contactForm" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" maxlength="50" autocomplete="name" required>
        <small class="error" id="nameErr"></small>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" maxlength="100" autocomplete="email" required>
        <small class="error" id="emailErr"></small>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" maxlength="1000" required></textarea>
        <small class="counter"><span id="count">0</span>/1000</small>
        <small class="error" id="messageErr"></small>
      </div>
      <button type="submit" id="submitBtn"><span class="label">Send message</span><span class="spinner" hidden></span></button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
